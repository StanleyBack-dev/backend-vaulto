  login(input: LoginInputDto!): AuthSessionResponseDto!
  refreshAuthSession: AuthSessionResponseDto!
  logout: LogoutResponseDto!
  changeMyPassword(input: ChangePasswordInputDto!): LogoutResponseDto!
  requestPasswordRecovery(
    input: RequestPasswordRecoveryInputDto!
  ): LogoutResponseDto!
  verifyPasswordRecoveryCode(
    input: VerifyPasswordRecoveryCodeInputDto!
  ): VerifyPasswordRecoveryCodeMutationResponseDto!
  resetPasswordWithRecovery(
    input: ResetPasswordWithRecoveryInputDto!
  ): LogoutResponseDto!
  createUser(input: CreateUserInputDto!): CreateUserMutationResponseDto!
  updateUser(input: UpdateUserInputDto!): UpdateUserMutationResponseDto!
  adminUpdateUserAccess(
    input: AdminUpdateUserAccessInputDto!
  ): AdminUpdateUserAccessMutationResponseDto!
  setUserPagePermissions(
    input: SetUserPagePermissionsInputDto!
  ): SetUserPagePermissionsMutationResponseDto!
  unlockUserCredential(
    input: UnlockUserCredentialInputDto!
  ): UnlockUserCredentialMutationResponseDto!
  createCustomers(
    input: CreateCustomersInputDto!
  ): CreateCustomersMutationResponseDto!
  updateCustomers(
    input: UpdateCustomersInputDto!
  ): UpdateCustomersMutationResponseDto!
  createEmployees(
    input: CreateEmployeesInputDto!
  ): CreateEmployeesMutationResponseDto!
  updateEmployees(
    input: UpdateEmployeesInputDto!
  ): UpdateEmployeesMutationResponseDto!
  createLeads(input: CreateLeadsInputDto!): CreateLeadsMutationResponseDto!
  updateLeads(input: UpdateLeadsInputDto!): UpdateLeadsMutationResponseDto!
  createContracts(
    input: CreateContractsInputDto!
  ): CreateContractsMutationResponseDto!
  updateContracts(
    input: UpdateContractsInputDto!
  ): UpdateContractsMutationResponseDto!
  generateContractPreviewPdf(
    input: GenerateContractPreviewInputDto!
  ): GenerateContractPreviewMutationResponseDto!
  sendContractEmail(input: SendContractEmailInputDto!): SuccessResponseDto!
  sendContractSignatureRequest(
    input: SendContractSignatureRequestInputDto!
  ): SuccessResponseDto!
  closeContractWithoutSignature(
    input: CloseContractWithoutSignatureInputDto!
  ): SuccessResponseDto!
  createSignatureRequest(
    input: CreateSignatureRequestInputDto!
  ): CreateSignatureRequestMutationResponseDto!
  getSignatureStatus(
    input: GetSignatureStatusInputDto!
  ): GetSignatureStatusMutationResponseDto!
  cancelSignatureRequest(
    input: CancelSignatureRequestInputDto!
  ): SuccessResponseDto!
  updateEvents(input: UpdateEventsInputDto!): UpdateEventsMutationResponseDto!
  updateEventAssignment(
    input: UpdateEventAssignmentInputDto!
  ): UpdateEventAssignmentMutationResponseDto!
  createPayment(input: CreatePaymentInputDto!): CreatePaymentResponseDto!
  updatePayment(input: UpdatePaymentInputDto!): UpdatePaymentResponseDto!
  createBudgets(
    input: CreateBudgetsInputDto!
  ): CreateBudgetsMutationResponseDto!
  updateBudgets(
    input: UpdateBudgetsInputDto!
  ): UpdateBudgetsMutationResponseDto!
  generateBudgetPreviewPdf(
    input: GenerateBudgetPreviewInputDto!
  ): GenerateBudgetPreviewMutationResponseDto!
  sendBudgetEmail(input: SendBudgetEmailInputDto!): SuccessResponseDto!
  createPositions(
    input: CreatePositionsInputDto!
  ): CreatePositionsMutationResponseDto!
  updatePositions(
    input: UpdatePositionsInputDto!
  ): UpdatePositionsMutationResponseDto!
}

